[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# ============================================================================
# Metadata del proyecto
# ============================================================================
[project]
name = "prisma-gti"
version = "0.1.0"
description = "Plataforma de Reportes e Indicadores de Servicios y Mesa de Atención — FINAGRO GTI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "FINAGRO — Dirección de Operaciones Tecnológicas" }
]
keywords = ["etl", "indicadores", "gti", "finagro", "itsm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Private :: Do Not Upload",
]

# ============================================================================
# Dependencias de runtime
# ============================================================================
dependencies = [
    # Procesamiento de datos
    "pandas>=2.1.0,<4.0",
    "numpy>=1.26.0,<3.0",
    "openpyxl>=3.1.0",         # Lectura/escritura .xlsx
    "pyarrow>=14.0.0",          # Soporte Parquet
    "xlrd>=2.0.0",              # Lectura .xls legacy si se necesita

    # Conectividad
    "pyodbc>=5.0.0",            # SQL Server
    "ldap3>=2.9.0",             # Active Directory
    "requests>=2.31.0",         # Google Sheets URLs

    # Modelos de ML
    "scikit-learn>=1.4.0",
    "statsmodels>=0.14.0",

    # Utilidades
    "unidecode>=1.3.0",         # Normalización de acentos
    "python-dotenv>=1.0.0",     # Carga de .env
    "pyyaml>=6.0",              # Configuración YAML

    # CLI y logging
    "typer>=0.9.0",             # CLI (extra [all] deprecado desde typer 0.12)
    "rich>=13.0.0",             # Output enriquecido en terminal
    "loguru>=0.7.0",            # Logging estructurado
]

# ============================================================================
# Dependencias opcionales
# ============================================================================
[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",      # Tests en paralelo

    # Linting y formato
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "types-PyYAML",
    "pandas-stubs",

    # Profiling
    "line-profiler>=4.1.0",
    "memory-profiler>=0.61.0",
    "snakeviz>=2.2.0",          # Visualizador cProfile

    # Pre-commit
    "pre-commit>=3.6.0",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]

# ============================================================================
# Punto de entrada CLI
# ============================================================================
[project.scripts]
prisma = "prisma_gti.cli:app"

# ============================================================================
# Configuración de setuptools (descubrimiento de paquetes)
# ============================================================================
[tool.setuptools.packages.find]
where = ["src"]
include = ["prisma_gti*"]

# ============================================================================
# Ruff — linter y formateador
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [
    "data",
    "legacy",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long (delegado a formatter)
    "B008",   # argumentos por defecto con llamadas (típico en typer)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "S101"]  # asserts y argumentos no usados están bien en tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ============================================================================
# MyPy — type checking
# ============================================================================
[tool.mypy]
python_version = "3.11"
strict = false                  # Empezamos suave; subir nivel después
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true   # Necesario por pyodbc, ldap3 sin stubs
plugins = []

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ============================================================================
# Pytest
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "unit: tests unitarios rápidos (sin red, sin DB)",
    "integration: tests de integración (pueden requerir fixtures grandes)",
    "slow: tests lentos (>5s)",
    "requires_db: requiere acceso a SQL Server (skip en CI sin VPN)",
    "requires_ldap: requiere acceso a LDAP (skip en CI sin VPN)",
]

# ============================================================================
# Coverage
# ============================================================================
[tool.coverage.run]
source = ["src/prisma_gti"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/cli.py",  # CLI se prueba a nivel de integración
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]